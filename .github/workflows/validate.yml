name: Validate CoreNet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python scripts/validate-repository.py
      - name: Validate architecture
        run: python scripts/validate-architecture.py
      - name: Validate upstream snapshots
        run: python scripts/validate-upstream-snapshots.py
      - name: Validate Foundation Skills
        run: python scripts/validate-foundation-skills.py
      - name: Validate core-network-pcap
        run: python scripts/validate-core-network-pcap.py
      - name: Validate ngap
        run: python scripts/validate-ngap.py
      - name: Validate nas-5gs
        run: python scripts/validate-nas-5gs.py
      - name: Validate pfcp
        run: python scripts/validate-pfcp.py
      - name: Validate gtpu
        run: python scripts/validate-gtpu.py
      - name: Validate sbi-http2
        run: python scripts/validate-sbi-http2.py
      - name: Validate cross-protocol-evidence
        run: python scripts/validate-cross-protocol-evidence.py
      - name: Validate procedure-evidence
        run: python scripts/validate-procedure-evidence.py
      - name: Validate 5gc-registration-mobility
        run: python scripts/validate-5gc-registration-mobility.py
      - name: Validate 5gc-pdu-session
        run: python scripts/validate-5gc-pdu-session.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile validation scripts
        run: python -m compileall scripts skills/protocol/core-network-pcap/scripts skills/protocol/ngap/scripts skills/protocol/nas-5gs/scripts skills/protocol/pfcp/scripts skills/protocol/gtpu/scripts skills/protocol/sbi-http2/scripts skills/correlation/cross-protocol-evidence/scripts skills/domain/procedure-evidence/scripts skills/domain/5gc-registration-mobility/scripts skills/domain/5gc-pdu-session/scripts
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
