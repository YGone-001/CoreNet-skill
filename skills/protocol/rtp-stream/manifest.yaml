name: rtp-stream
version: 0.1.0
category: protocol
description: >
  Bounded RTP source-stream reconstruction and RFC 3550 Appendix A.1
  sequence-integrity evidence over accepted RTP/RTCP Analysis artifacts. It
  groups observed RTP packets by capture, UDP stream and capture-scoped SSRC
  reference, reconstructs epoch-local extended sequence numbers, and reports
  wrap, duplicate, out-of-order, gap and restart-pattern evidence without any
  packet-loss, QoS, media-delivery or call verdict.
scope:
  includes:
    - capture-scoped RTP source-stream identity from capture SHA-256, UDP stream and capture-scoped SSRC reference
    - UDP-stream and SSRC isolation without endpoint or SSRC-only merging
    - deterministic capture observation ordering by frame, occurrence and event reference
    - bounded RFC 3550 Appendix A.1 sequence validation with RTP_SEQ_MOD 65536, MIN_SEQUENTIAL 2, MAX_DROPOUT 3000 and MAX_MISORDER 100
    - initial source probation and sequential-packet validation
    - epoch-local extended sequence reconstruction and 16-bit sequence wrap counting
    - duplicate sequence observation and out-of-order packet observation
    - unobserved sequence-number slot evidence inside the observed validated range
    - restart candidate and confirmed restart-pattern evidence with independent epochs
    - capture-boundary limitation preservation without leading, trailing or termination inference
    - complete RTP event accounting through assigned source streams or an unassigned packet inventory
    - RTCP event counting with explicit NOT_INTERPRETED_FOR_RTP_STREAM_ASSOCIATION status
    - strict input provenance, SHA-256, schema and semantic validation
    - deterministic JSON and plain-text reporting with count conservation and truncation accounting
  excludes:
    - RTP packet decoding, raw PCAP input or TShark execution
    - RTP payload, codec, audio or video reconstruction
    - SDP parsing, Offer/Answer pairing or SIP dialog association
    - SDP-to-RTP endpoint correlation and RTCP-to-RTP stream association
    - local packet-loss, jitter, MOS or QoS measurement
    - network packet-loss, retransmission, restart-cause or SSRC-collision verdicts
    - RTP delivery, two-way audio, call success or teardown verification
    - ICE, STUN, TURN, NAT mapping, DTLS or SRTP decryption
    - RTP header-extension MID demultiplexing
    - subscriber, UE or IMS identity association
dependencies:
  required:
    - sdp-rtp >=0.4.0
  optional: []
inputs:
  - RTP/RTCP Analysis JSON (analysis name rtp-rtcp, analysis version 0.4.0, event schema 1.2.0, parser version 0.4.0) with optional capture-scoped HMAC endpoint references
outputs:
  - schemas/rtp-stream-analysis.schema.json
  - scripts/reconstruct-rtp-streams.py
  - scripts/rtp_stream_model.py
  - bounded RTP source-stream analysis JSON
  - optional plain-text reconstruction report
protocols:
  - RTP
  - RTCP
interfaces: []
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INSUFFICIENT_EVIDENCE
  - AMBIGUOUS
  - PROBATION
  - VALIDATED
upstream:
  repository: https://www.rfc-editor.org/rfc/rfc3550.txt
  path: null
  commit: null
  license: IETF Trust RFC 3550
  local_modifications: Original CoreNet implementation; no upstream code imported. The bounded sequence-number tracking follows RFC 3550 Appendix A.1.
testing:
  fixtures:
    - examples/inputs/rtp-rtcp-analysis.json
  expected_results:
    - examples/expected/rtp-stream-analysis.json
    - examples/expected/rtp-stream-report.txt