name: nas-eps
version: 0.2.0
category: protocol
description: >
  Bounded EPS NAS semantic extraction: message identity for the EPS attach,
  identity, authentication and NAS security mode control subset, security header
  type and protection state, EMM cause preservation, bounded attach and identity
  type metadata, ESM container presence and length only, protected-inner-message
  classification, detailed NAS-EPS events, and normalized trace-event projection.
scope:
  includes:
    - EPS NAS message identity for the bounded attach/identity/authentication/security-mode subset
    - security header type and derived protection state
    - EMM cause value and reviewed name preservation
    - bounded attach type and identity type value metadata (never the identity value)
    - ESM container presence and length only (no ESM decoding)
    - protected inner message classification without fabricating inner semantics
    - direction when the enclosing S1AP message exposes it, with the basis recorded
    - detailed NAS-EPS event JSONL and shared trace-event projection
    - tshark-assisted capture extraction and deterministic structured offline input
  excludes:
    - ESM message semantics, EPS bearer or PDN connection state
    - LTE Attach procedure state or end-to-end attach verdicts
    - first-abnormal-boundary selection, severity ranking, or root-cause output
    - subscriber identity values (IMSI, IMEI, IMEISV, GUTI, TMSI)
    - authentication parameters (RAND, AUTN, RES, XRES) and key material
    - MME implementation, vendor configuration, or source-code mapping
    - S1AP message semantics (handoff to s1ap)
dependencies:
  required: []
  optional:
    - core-network-pcap >=0.1.0
    - wireshark-analysis >=0.2.0
    - tshark
inputs:
  - PCAP or PCAPNG capture containing EPS NAS (requires user-installed tshark)
  - structured NAS-EPS fields JSONL (deterministic offline input, documented in references/field-reference.md)
outputs:
  - detailed NAS-EPS event JSON Lines (schemas/nas-eps-event.schema.json)
  - normalized trace-event JSON Lines projection (schemas/trace-event.schema.json)
  - protocol-local NAS-EPS timeline (text or JSON)
protocols: [NAS-EPS]
interfaces: [N1]
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INFERRED
  - HYPOTHESIS
  - CONFIRMED
upstream:
  repository: null
  path: null
  commit: null
  license: null
  local_modifications: Original CoreNet Protocol-layer package; no upstream material imported.
testing:
  fixtures:
    - examples/extracted/attach-flow.jsonl
    - examples/extracted/attach-accept-complete.jsonl
    - examples/extracted/authentication.jsonl
    - examples/extracted/identity.jsonl
    - examples/extracted/auth-failure.jsonl
    - examples/extracted/security-mode.jsonl
    - examples/extracted/security-reject.jsonl
    - examples/extracted/protected-inner.jsonl
    - examples/extracted/esm-container.jsonl
    - examples/extracted/unsupported.jsonl
    - examples/extracted/malformed.jsonl
    - examples/extracted/missing-required.jsonl
  expected_results:
    - examples/expected/attach-flow-events.jsonl
    - examples/expected/attach-accept-complete-events.jsonl
    - examples/expected/authentication-events.jsonl
    - examples/expected/identity-events.jsonl
    - examples/expected/auth-failure-events.jsonl
    - examples/expected/security-mode-events.jsonl
    - examples/expected/security-reject-events.jsonl
    - examples/expected/protected-inner-events.jsonl
    - examples/expected/esm-container-events.jsonl
    - examples/expected/unsupported-events.jsonl
