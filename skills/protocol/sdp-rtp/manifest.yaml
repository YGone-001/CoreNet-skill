name: sdp-rtp
version: 0.4.0
category: protocol
description: Bounded RFC 8866 SDP structural evidence plus RFC 3550 RTP/RTCP packet evidence extraction, with optional privacy-safe capture-scoped HMAC endpoint references.
scope:
  includes:
    - RFC 8866 SDP structural parsing of explicitly supplied bodies
    - RFC 3550 RTP version 2 packet evidence extraction
    - RTP fixed-header and bounded extension metadata
    - RTCP SR/RR/SDES/BYE evidence extraction
    - RTCP compound component ordering where hierarchy is proven
    - nested Receiver Report block evidence
    - privacy-safe payload, extension and identity redaction
    - authorized TShark capture extraction
    - deterministic structured JSONL input
    - capture-scoped RTP SSRC and RTCP component references
    - optional keyed SDP media and RTP UDP endpoint references scoped to the original capture
    - owner-only local endpoint key loading and domain-separated correlation context references
    - explicit unsupported packet-family classification
  excludes:
    - RTP stream reconstruction
    - local packet-loss and jitter calculations
    - MOS and media QoS
    - SDP Offer/Answer pairing
    - SIP-to-SDP association
    - SDP-to-RTP endpoint correlation (owned by the sdp-rtp-transport Correlation Skill)
    - raw address or port publication
    - ICE connectivity verification
    - SRTP decryption
    - IMS media verdicts
    - Diameter Rx and charging
dependencies:
  required: []
  optional:
    - TShark installed by the operator for authorized PCAP/PCAPNG extraction
inputs:
  - Structured JSONL with capture provenance and nested RTCP component/report-block structures
  - Optional owner-only 32-byte local endpoint key file for capture-scoped HMAC endpoint references
  - Authorized PCAP/PCAPNG using an installed TShark dissector and optional explicit decode-as configuration
outputs:
  - schemas/sdp-events.schema.json
  - schemas/rtp-rtcp-events.schema.json
  - scripts/parse-sdp.py
  - scripts/extract-rtp-rtcp.py
  - scripts/endpoint_reference.py
  - optional text reports
protocols:
  - SDP
  - RTP
  - RTCP
interfaces: []
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INCOMPLETE
  - AMBIGUOUS
  - UNSUPPORTED
  - INVALID
upstream:
  repository: https://www.rfc-editor.org/rfc/rfc8866.txt; https://www.rfc-editor.org/rfc/rfc3550.txt
  path: null
  commit: null
  license: IETF Trust RFC 8866 and RFC 3550
  local_modifications: Original CoreNet implementation; no upstream code imported.
testing:
  fixtures:
    - examples/inputs/sdp-cases.jsonl
    - examples/inputs/rtp-rtcp-cases.jsonl
  expected_results:
    - examples/expected/sdp-analysis.json
    - examples/expected/sdp-report.txt
    - examples/expected/rtp-rtcp-analysis.json
    - examples/expected/rtp-rtcp-report.txt