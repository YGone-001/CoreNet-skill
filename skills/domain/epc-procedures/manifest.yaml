name: epc-procedures
version: 0.7.0
category: domain
description: >
  Bounded EPS Attach procedure analysis over already-extracted S1AP and NAS-EPS
  events: deterministic procedure-instance formation from frame-anchored
  cross-protocol evidence, conditional attach/identity/authentication/security-mode/
  decision/completion stages, bounded S1 context setup and UE context release
  observations, procedure-local deviations with exact evidence references, and
  explicit evidence limitations, plus bounded EPC session-control analysis over
  already-extracted GTPv2-C events and transactions: message-scope and
  bearer-scope Cause separation, item-scoped bearer context evidence,
  evidence-based interface resolution, control-plane TEID continuity grouping
  and explicit cross-interface and Attach-association limitations, plus bounded
  EPS default-bearer signalling evidence over already-extracted NAS-EPS ESM,
  S1AP E-RAB and GTPv2-C tunnel-endpoint evidence: staged PDN connectivity, ESM
  information exchange, default bearer activation and S1 E-RAB setup with
  explicit protected-ESM handling, typed and frame-anchored ESM negative
  deviations, and evidence-safe cross-interface identity links, plus bounded
  EPC S1-U GTP-U packet observation over already-extracted GTP-U events and
  stream summaries: directed stream evidence, receiving-endpoint matching,
  supported/ambiguous/unbound association and bounded packet and byte counts,
  plus bounded EPC bearer lifecycle-generation evidence over the accepted GTPv2-C
  transaction correlation: advertisement-family classification of repeated S1-U
  F-TEID advertisements, generation identity scoped by capture, role, endpoint and
  interface type, explicit release boundaries and endpoint-reuse observations, and
  frame-level GTP-U attribution with conserved packet and octet accounting, plus
  bounded EPC S11<->S5/S8 session-identity bridge and release-binding evidence over
  the accepted GTPv2-C events and transactions: hop-local session contexts joined
  only by receiver-scoped control-plane F-TEID addressing with its GTP-C path peer,
  cross-interface endpoint correspondence kept strictly separate from session
  identity, session identity established only by a unique relayed PGW S5/S8
  control-plane F-TEID, release-to-session bindings with separately classified
  release outcomes, and reviewed session-context generation closure consumed by the
  lifecycle capability through a documented input contract. No protocol decoding, no
  bearer or PDN success claim, no delivery verdict, no global failure-boundary
  selection, no root cause.
scope:
  includes:
    - EPS Attach procedure instance formation scoped by capture, SCTP association and S1AP UE identifiers
    - frame-anchored NAS-EPS to S1AP UE context association
    - conditional stage evaluation for attach initiation, identity, authentication, security mode control, attach decision, attach completion, S1 context setup and context release
    - procedure-local deviation classification with machine-readable evidence references
    - protected-envelope and partial-capture limitations
    - bounded GTPv2-C session-control transaction evidence for Create Session, Modify Bearer, Delete Session, Release Access Bearers and Echo
    - message-scope and bearer-scope Cause preservation with explicit scope
    - message-scope and item-scoped F-TEID and EBI evidence
    - evidence-based S11 and S5/S8 hop resolution without transport-address inference
    - control-plane TEID continuity grouping with generation handling and explicit reuse
    - bounded ESM evidence for PDN connectivity, default bearer activation and the ESM information exchange
    - item-scoped S1AP E-RAB tunnel endpoint evidence and exact S1-U endpoint comparison
    - default-bearer stage model with OBSERVED, NOT_OBSERVED, UNAVAILABLE_PROTECTED, AMBIGUOUS and INSUFFICIENT_EVIDENCE
    - evidence-safe identity links classified ESTABLISHED, SUPPORTED, AMBIGUOUS or NOT_ESTABLISHED
    - bounded S1-U GTP-U stream observation with receiving-endpoint matching and packet/byte counts
    - S1-U association classified SUPPORTED, AMBIGUOUS or NOT_ESTABLISHED with explicit unbound streams
    - advertisement-family classification of repeated S1-U F-TEID advertisements using the accepted transaction correlation
    - bounded bearer lifecycle-generation observations with deterministic scoped pseudonymous references
    - release boundaries proved only by an accepted release that names the released S1-U endpoint
    - endpoint reuse across a proved boundary published as separate generations; reuse without proof stays ambiguous
    - generation-aware GTP-U attribution from frame-level events with conserved packet and octet accounting
    - hop-local S11 and S5/S8 session contexts joined only by receiver-scoped control-plane F-TEID addressing with its GTP-C path peer
    - cross-interface endpoint correspondence published separately from cross-interface session identity
    - session identity established only by a relayed PGW S5/S8 control-plane F-TEID that is equal and unique on both hops
    - bearer association established only by a valid assigned item-scoped EPS Bearer Identity, with zero and out-of-domain values retained as diagnostic evidence that establish nothing
    - release-to-session bindings whose outcomes stay separately classified
    - reviewed session-context generation closure consumed by the lifecycle capability through a documented input contract
    - per-release narrative over accepted session-identity, bearer-lifecycle and S1-U evidence with separate release outcome, session-binding and generation-closure statuses
    - frame-aware temporal placement of observed G-PDUs before, inside and after a release window, with an explicit TEMPORAL_PLACEMENT_NOT_ESTABLISHED result when only aggregate stream evidence exists
  excludes:
    - Diameter, S6a or Gx/Gy signalling
    - cross-interface S11 to S5/S8 session association without a reviewed identity bridge
    - Attach UE to GTPv2-C session association without a reviewed identity bridge
    - a complete EPS bearer state machine or any user-plane delivery verdict
    - generation splits without a proved release boundary bound to the same endpoint
    - GTP-U sequence-gap packet-loss inference, UE delivery confirmation or application reachability
    - inner packet content publication
    - dedicated EPS bearer procedures, PDN disconnect lifecycle and the complete ESM state machine
    - S1-U user-plane validation
    - success, failure or root-cause verdicts and network-function blame
    - global EPC first-abnormal-boundary selection; per-subject selection belongs to the epc-failure-boundary Orchestration Skill
    - subscriber identity handling of any kind
dependencies:
  required: []
  optional:
    - procedure-evidence >=0.1.0
    - s1ap >=0.1.0
    - nas-eps >=0.1.0
    - gtpv2 >=0.1.0
inputs:
  - detailed S1AP event JSONL produced by the s1ap Protocol Skill
  - detailed NAS-EPS event JSONL produced by the nas-eps Protocol Skill
  - detailed GTPv2-C event JSONL produced by the gtpv2 Protocol Skill
  - GTPv2-C transaction correlation JSON produced by the gtpv2 Protocol Skill
  - GTPv2-C event JSONL for exact S1-U tunnel endpoint identity only
  - accepted EPC session-control, default-bearer and S1-U observation JSON for lifecycle evidence
  - detailed GTP-U event JSONL for frame-level generation attribution
outputs:
  - EPS Attach analysis JSON (schemas/epc-attach-analysis.schema.json)
  - stage timeline JSON Lines
  - protocol-local text timeline
  - EPC session-control analysis JSON (schemas/epc-session-analysis.schema.json)
  - session-control procedure timeline JSON Lines
  - EPS default-bearer analysis JSON (schemas/epc-default-bearer-analysis.schema.json)
  - default-bearer procedure timeline JSON Lines and text
  - S1-U observation JSON (schemas/epc-s1u-observation.schema.json)
  - S1-U stream timeline JSON Lines and text
  - EPC bearer lifecycle analysis JSON (schemas/epc-bearer-lifecycle-analysis.schema.json)
  - bearer generation timeline JSON Lines
  - EPC session-identity analysis JSON (schemas/epc-session-identity-analysis.schema.json)
  - session-identity text report
  - EPC release-narrative analysis JSON (schemas/epc-release-narrative-analysis.schema.json)
  - release-narrative text report
protocols: [S1AP, NAS-EPS, GTPv2-C, GTP-U]
interfaces: [S1-MME, N1, S11, S5/S8, S1-U]
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INFERRED
  - HYPOTHESIS
  - CONFIRMED
upstream:
  repository: null
  path: null
  commit: null
  license: null
  local_modifications: Original CoreNet Domain-layer package; no upstream material imported.
