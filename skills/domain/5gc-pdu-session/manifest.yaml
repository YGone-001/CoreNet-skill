name: 5gc-pdu-session
version: 0.2.0
category: domain
description: >
  Bounded 5GC PDU Session Establishment and Modification procedure-level analysis composing
  N1 (NAS-5GS), N2 (NGAP), N3 (GTP-U), N4 (PFCP), and N11 (SBI-HTTP2) evidence:
  instance formation anchored by NGAP UE-context and PDU Session ID, partial-order
  stage evaluation, repeated modification attempt modeling, protocol reject and
  negative cause recognition, multi-UE isolation, ambiguous N11 preservation,
  F-TEID directed endpoint tunnel binding, item-scoped NGAP resource outcomes,
  procedure-local deviation classification, lower-layer field findings, and generic
  procedure-evidence stage records. No protocol decoding, no verdicts, no implementation mapping.
scope:
  includes:
    - procedure instance formation from NGAP UE context and PDU Session ID with frame-provenance NAS joins
    - evaluation of bounded establishment stages: SESSION_REQUEST, SM_CONTEXT_CONTROL, USER_PLANE_CONTROL, ACCESS_RESOURCE_CONTROL, N1_N2_DELIVERY, SESSION_DECISION, USER_PLANE_OBSERVATION
    - evaluation of bounded modification stages: MODIFICATION_INITIATION, SM_CONTEXT_UPDATE, USER_PLANE_CONTROL_UPDATE, ACCESS_RESOURCE_UPDATE, N1_N2_DELIVERY, MODIFICATION_COMPLETION, POST_MODIFICATION_OBSERVATION
    - repeated modification attempt modeling (0..N attempts per established session) with UE-requested and network-requested triggers
    - multi-plane evidence association across N1, N2, N3, N4, and N11
    - protocol-defined reject, negative cause, and pending recognition
    - multi-UE isolation and ambiguous/unbound evidence preservation
    - procedure-local deviation classification and lower-layer field findings
    - generic procedure-evidence stage records and analysis summary JSON
  excludes:
    - PDU Session Release lifecycle
    - handover and path switch
    - UPF relocation
    - NAS, NGAP, PFCP, GTP-U, or HTTP/2 byte-level decoding
    - success, failure, or root-cause verdicts; implementation blame
    - Open5GS, free5GC, or vendor-specific source mapping
dependencies:
  required: []
  optional:
    - procedure-evidence >=0.1.0
    - cross-protocol-evidence >=0.1.0
    - nas-5gs >=0.2.0
    - ngap >=0.2.0
    - pfcp >=0.1.0
    - gtpu >=0.1.0
    - sbi-http2 >=0.2.0
    - core-network-pcap >=0.1.0
inputs:
  - NAS-5GS detailed event JSONL (from the nas-5gs Skill)
  - NGAP detailed event JSONL (from the ngap Skill)
  - PFCP detailed event JSONL (from the pfcp Skill)
  - GTP-U detailed event JSONL (from the gtpu Skill)
  - SBI-HTTP2 detailed event JSONL (from the sbi-http2 Skill)
  - cross-protocol-evidence correlation-event JSONL (optional)
outputs:
  - generic procedure-evidence stage JSONL
  - 5GC PDU session analysis summary JSON
  - protocol-local PDU session timeline (text or JSON)
protocols: []
interfaces:
  - N1
  - N2
  - N3
  - N4
  - N11
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INFERRED
  - HYPOTHESIS
  - CONFIRMED
upstream:
  repository: null
  path: null
  commit: null
  license: null
  local_modifications: Original CoreNet Domain-layer package; no upstream material imported.
