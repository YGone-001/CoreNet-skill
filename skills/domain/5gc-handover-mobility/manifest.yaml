name: 5gc-handover-mobility
version: 0.1.0
category: domain
description: >
  Bounded 5GC mobility Domain analysis: forms separate handover_attempts and
  path_switch_attempts from already-extracted NGAP mobility evidence
  (ngap >=0.3.0), associates source and target NG-RAN contexts only through
  the same capture, a scoped AMF-UE-NGAP-ID context, compatible reviewed
  roles, and temporal sanity, evaluates branch-aware conditional stages with
  missing-evidence visibility, preserves item-scoped PDU Session resource
  outcomes, and binds bounded N11/N4/N3 supporting evidence only through safe
  session and tunnel context. No protocol decoding, no procedure-outcome
  verdicts, no UPF-relocation claims, no implementation mapping.
scope:
  includes:
    - separated handover_attempts[] and path_switch_attempts[] attempt families (neither mandatory for the other)
    - handover attempt formation from HandoverRequired, HandoverCommand, HandoverPreparationFailure, HandoverRequest, HandoverRequestAcknowledge, HandoverFailure, HandoverNotify, HandoverCancel, and HandoverCancelAcknowledge evidence
    - independent path switch attempt formation from PathSwitchRequest, PathSwitchRequestAcknowledge, and PathSwitchRequestFailure evidence
    - evidence-bounded source/target association with STRONG, SUPPORTED, AMBIGUOUS, and UNBOUND strengths and AMF-UE-NGAP-ID reuse safety
    - HandoverType domain-scope distinction (INTRA_5GS versus INTER_SYSTEM_OR_OTHER) with explicit scope limitations
    - branch-aware conditional stage evaluation and missing-evidence visibility
    - item-scoped PDU Session resource findings with RESOURCE_FAILED_ITEM_OBSERVED and FIELD_CONFLICT deviations
    - bounded N11 UpdateSMContext, N4 PFCP Session Modification, and N3 GTP-U supporting evidence association through safe session and tunnel context
    - procedure-local deviations with structured evidence_refs for Analysis Orchestration
    - generic procedure-evidence stage records and an analysis summary JSON
  excludes:
    - NGAP, PFCP, GTP-U, SBI, or NAS decoding and protocol field reinterpretation
    - decoding NGAP opaque mobility transfer bytes or deriving N3 tunnel identity from NGAP
    - handover or path-switch success verdicts, UPF relocation success, or user-plane validation
    - RAN Status Transfer, inter-system and 5GS-EPS mobility procedure semantics, Xn protocol ownership
    - radio, RRC, MAC, or PHY diagnosis
    - subscriber identity handling; AMF-UE-NGAP-ID as a global or permanent identity
    - implementation, vendor, or product source mapping
    - end-to-end root-cause determination or cross-Domain first-boundary selection
dependencies:
  required: []
  optional:
    - procedure-evidence >=0.1.0
    - ngap >=0.3.0
    - pfcp >=0.1.0
    - gtpu >=0.1.0
    - sbi-http2 >=0.2.0
    - cross-protocol-evidence >=0.1.0
    - 5gc-pdu-session >=0.4.0
inputs:
  - NGAP detailed event JSONL (from the ngap Skill, >=0.3.0 mobility evidence)
  - PFCP detailed event JSONL (from the pfcp Skill; optional supporting N4 evidence)
  - GTP-U detailed event JSONL (from the gtpu Skill; optional supporting N3 evidence)
  - SBI-HTTP2 detailed event JSONL (from the sbi-http2 Skill; optional supporting N11 evidence)
  - 5gc-pdu-session analysis summary JSON (optional, >=0.4.0, lifecycle-generation and N4/N3 binding context)
outputs:
  - 5GC handover/path-switch mobility analysis summary JSON (schemas/5gc-handover-mobility-analysis.schema.json)
  - generic procedure-evidence stage JSONL (optional)
protocols: []
interfaces:
  - N2
  - N3
  - N4
  - N11
network_functions: []
evidence_levels:
  - OBSERVED
  - DERIVED
  - INFERRED
  - HYPOTHESIS
  - CONFIRMED
upstream:
  repository: null
  path: null
  commit: null
  license: null
  local_modifications: Original CoreNet Domain-layer package; no upstream material imported.
